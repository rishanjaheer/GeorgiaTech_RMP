<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMP for Georgia Tech</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #003057;
      color: #ffffff;
    }

    .header {
      background: #B3A369;
      color: #003057;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .header .subtitle {
      font-size: 11px;
      opacity: 0.85;
    }

    .content {
      padding: 16px;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #e0e0e0;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      border-radius: 24px;
      transition: background-color 0.2s;
    }

    .toggle-slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background-color: #B3A369;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    .link {
      display: block;
      font-size: 12px;
      color: #B3A369;
      text-decoration: none;
      text-align: center;
      padding: 8px;
      border: 1px solid #B3A369;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .link:hover {
      background-color: rgba(179, 163, 105, 0.15);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>RMP for Georgia Tech</h1>
    <div class="subtitle">Rate My Professors on OSCAR</div>
  </div>
  <div class="content">
    <p class="description">Automatically shows Rate My Professors ratings on OSCAR.</p>
    <div class="toggle-row">
      <span class="toggle-label">Enable extension</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <a class="link" id="rmp-link" href="#" target="_blank" rel="noopener noreferrer">
      View Georgia Tech professors on RMP &rarr;
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
